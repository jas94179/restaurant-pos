<!doctype html><html><head><meta charset="utf-8"><link rel="stylesheet" href="kit.css">
<style>
.fl { position: absolute; inset: 0; display: flex; align-items: center; justify-content: center; text-align: center; font-size: 150px; line-height: 156px; font-weight: 700; letter-spacing: -5px; opacity: 0; padding: 0 60px; }
.ch { display: inline-block; opacity: 0; }
</style></head><body>
<div id="s0" class="scene" style="background: #07140E;">
  <div id="glow" class="abs" style="left: -200px; top: 260px; width: 1480px; height: 1480px; border-radius: 50%; background: radial-gradient(circle, rgba(242,176,30,0.45) 0%, rgba(242,176,30,0.12) 35%, rgba(242,176,30,0) 65%);"></div>
  <div id="l1" class="abs" style="left: 0; right: 0; top: 820px; text-align: center; font-size: 64px; font-weight: 600; letter-spacing: 2px; color: #E8EFEA;"></div>
  <div id="l2" class="abs" style="left: 0; right: 0; top: 910px; text-align: center; font-size: 64px; font-weight: 600; letter-spacing: 2px; color: #F2B01E;"></div>
</div>
<div id="fls"></div>
<div id="s2" class="scene" style="background: #17382A;">
  <div class="abs" style="left: 390px; top: 560px; width: 300px; height: 260px;">
    <div id="coin" class="coin" style="left: 75px; top: 0; width: 150px; height: 150px; border-width: 10px; font-size: 76px;">₹</div>
    <div class="slot" style="left: 0; bottom: 40px; width: 300px; height: 38px; border-radius: 19px;"></div>
  </div>
  <div id="flash" class="abs" style="inset: 0; background: #fff; opacity: 0;"></div>
  <div id="wordwrap" class="abs" style="left: 0; right: 0; top: 860px; height: 210px; overflow: hidden;">
    <div id="word" class="h1" style="text-align: center; font-size: 200px; line-height: 210px; letter-spacing: -8px;">galla</div>
  </div>
  <div id="tag" class="abs" style="left: 100px; right: 100px; top: 1090px; text-align: center; font-size: 46px; line-height: 60px; color: #CFE0D6;">Billing for small restaurants.</div>
</div>
<div id="s3" class="scene" style="background: #F2B01E; color: #0F2A1F;">
  <div id="cs1" class="abs h1" style="left: 0; right: 0; top: 560px; text-align: center; font-size: 210px; line-height: 200px; letter-spacing: -9px;">Coming<br>soon.</div>
  <div id="cs2" class="abs" style="left: 120px; right: 120px; top: 1010px; text-align: center; font-size: 46px; line-height: 62px; font-weight: 600;">Restaurant billing that works,<br>even offline.</div>
  <div id="cs3" class="abs" style="left: 130px; right: 130px; top: 1250px; border-radius: 36px; background: #0F2A1F; color: #fff; padding: 40px; text-align: center;">
    <div style="font-size: 50px; font-weight: 700; letter-spacing: -1px;">Follow for early access</div>
    <div style="margin-top: 10px; font-size: 32px; color: #F2B01E; font-weight: 600;">Free trial for the first restaurants · [@your_handle]</div>
  </div>
</div>
<script src="kit.js"></script>
<script>
const L1 = 'Something new is coming', L2 = 'to your counter.';
$('l1').innerHTML = [...L1].map(c => '<span class="ch">' + (c === ' ' ? '&nbsp;' : c) + '</span>').join('');
$('l2').innerHTML = [...L2].map(c => '<span class="ch">' + (c === ' ' ? '&nbsp;' : c) + '</span>').join('');
const FL = [['Bills in 3 taps.', '#F2B01E', '#0F2A1F'], ['Works offline.', '#0F2A1F', '#FFFFFF'], ['UPI QR.', '#FFFFFF', '#17382A'], ['GST ready.', '#F2B01E', '#0F2A1F'], ['Kitchen slips.', '#17382A', '#F2B01E'], ['Day-end cash check.', '#FFFFFF', '#17382A']];
const F0 = 3.4, FD = 0.6;
$('fls').innerHTML = FL.map((f, i) => `<div id="fl${i}" class="fl" style="background:${f[1]}; color:${f[2]};">${f[0]}</div>`).join('');
window.render = function (t) {
  const g = prog(t, 0, 3.0); $('glow').style.opacity = 0.2 + 0.8 * g; $('glow').style.transform = 'scale(' + (0.6 + 0.5 * g + 0.03 * Math.sin(t * 3)) + ')';
  document.querySelectorAll('#l1 .ch').forEach((c, i) => { const p = out(prog(t, 0.3 + i * 0.035, 0.6 + i * 0.035)); c.style.opacity = p; c.style.transform = 'translateY(' + 20 * (1 - p) + 'px)'; });
  document.querySelectorAll('#l2 .ch').forEach((c, i) => { const p = out(prog(t, 1.4 + i * 0.035, 1.7 + i * 0.035)); c.style.opacity = p; c.style.transform = 'translateY(' + 20 * (1 - p) + 'px)'; });
  $('s0').style.opacity = 1 - prog(t, 3.0, 3.4);
  FL.forEach((f, i) => { const a = F0 + i * FD, el = $('fl' + i), on = t >= a && t < a + FD; el.style.opacity = on ? 1 : 0; const p = prog(t, a, a + 0.25); el.style.transform = 'scale(' + (1.25 - 0.25 * out(p)) + ')'; });
  const s2at = F0 + FL.length * FD + 0.25; // 7.25
  $('s2').style.opacity = t >= s2at ? 1 : 0;
  const cp = bounce(prog(t, s2at + 0.1, s2at + 1.0));
  $('coin').style.transform = 'translateY(' + (-760 * (1 - cp)) + 'px)';
  const imp = s2at + 0.1 + 0.9 / 2.75; $('flash').style.opacity = 0.7 * (1 - prog(t, imp, imp + 0.35)) * (t >= imp ? 1 : 0);
  const wp = out(prog(t, imp + 0.2, imp + 0.7)); $('word').style.transform = 'translateY(' + 210 * (1 - wp) + 'px)';
  rise('tag', t, imp + 0.7, 30, 0.5);
  slide('s3', t, 10.6); hideUntil('s3', t, 10.6);
  const cs = prog(t, 11.0, 11.4); $('cs1').style.opacity = Math.min(1, cs * 2); $('cs1').style.transform = 'scale(' + (1.3 - 0.3 * out(cs)) + ')';
  rise('cs2', t, 11.6, 30, 0.4); rise('cs3', t, 12.0, 70, 0.5);
};
render(0);
</script></body></html>
